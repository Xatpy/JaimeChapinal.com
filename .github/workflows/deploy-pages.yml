name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current site
        uses: actions/checkout@v6
        with:
          path: current-site

      - name: Check out v1 archive
        uses: actions/checkout@v6
        with:
          ref: v1
          path: v1-site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            current-site/yarn.lock
            v1-site/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          yarn --cwd current-site install --frozen-lockfile
          yarn --cwd v1-site install --frozen-lockfile

      - name: Build current site
        working-directory: current-site
        run: npm run build

      - name: Build v1 archive
        working-directory: v1-site
        run: npm run build:v1

      - name: Assemble both versions
        run: |
          cp -R v1-site/dist-v1 current-site/dist/v1
          touch current-site/dist/.nojekyll

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: current-site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
