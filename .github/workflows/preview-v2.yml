name: Build v2 preview

on:
  push:
    branches: ['2.0']
  pull_request:
    branches: ['2.0']

permissions:
  contents: read

concurrency:
  group: v2-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: npm run build:v2
